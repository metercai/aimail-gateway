name: gate-l0

# L0 of the gateway three-tier gate (defined in metercai/aimail-advanced: tests/RELEASE-GATES.md):
# Static checks + in-repo unit tests. No docker, no fixtures, no external network services.
# Local equivalent: bash tests/gateway/run-gateway-gate.sh (the mechanism source of truth, run-e2e.sh, lives in the advanced repo).
#
# Toolchain pinned: clippy/fmt verdicts drift with the rustc version (new versions bring new lints),
# and the local gate runs on 1.98.1 - CI must match, otherwise the same commit gets different verdicts on each side.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  l0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain (pinned to the gate's local version)
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc -V && cargo -V

      - name: fmt --check
        run: cargo fmt --check

      # --no-deps: vendored third-party crates (vendor/mailin) are outside our rewrite scope,
      # their lints are not a gate criterion for this repo.
      - name: clippy -D warnings
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: cargo test
        run: cargo test
