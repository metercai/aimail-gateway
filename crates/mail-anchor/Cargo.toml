[package]
name = "mail-anchor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "AIMail anchor layer: EmailBinding / DomainControl preimages, lifecycle checks and VC-assembly ports"
license = "MPL-2.0"
publish = false

# 边界（design plan §58）：本 crate 只做锚点层。
# - 邮件层（Content-v1 / DID-Signature 头 / Ed25519）在 did-sdk，不得在此重新实现；
# - 禁止 axum / rusqlite / mailin / reqwest：所有 I/O 走 src/ports.rs 的 trait。
[dependencies]
async-trait = "0.1"
blake2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
