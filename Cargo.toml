[package]
name = "aimail-gateway"
version = "1.0.20"
edition = "2021"
description = "Lightweight SMTP ↔ HTTP bidirectional email gateway for hybrid human–agent group conversations."
license = "MPL-2.0"
repository = "https://github.com/metercai/aimail-gateway"
authors = ["metercai"]

[[bin]]
name = "aimail-gateway"
path = "src/main.rs"

[[bin]]
name = "aimail-gateway-health"
path = "src/bin/health.rs"

[lib]
name = "aimail_base"
path = "src/lib.rs"

[features]
default = []
# DID 邮件增强（DID-Signature 收发）。P0 只有骨架；P2 起追加
#   did-mail = ["dep:chain-sdk", "dep:did-sdk"]
# 默认关闭：不带该 feature 的构建行为与本改动之前完全一致。
did-mail = []
# Opt-in database-at-rest encryption (SQLCipher). It pulls a vendored OpenSSL
# into the build, which the default musl/static release deliberately avoids:
#
#   cargo build --release --features sqlcipher
#
# With this feature off, `storage.encryption = true` is rejected at startup
# instead of silently writing a plaintext database.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }

# HTTP framework
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
futures-util = "0.3"

# HTTP client (webhook delivery) — pure Rust TLS, no OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
async-trait = "0.1"

# Database (SQLite with bundled libsqlite3)
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# SMTP server
mailin = { path = "vendor/mailin" }

# SMTP client — pure Rust TLS (rustls), no OpenSSL
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }

# MIME parsing
mailparse = "0.15"

# Encoding conversion for MIME body charset (GBK, GB2312, etc.)
encoding_rs = "0.8"

# HTML → Markdown conversion
html-to-markdown-rs = "3"

# Encoding / crypto
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"

# Identifiers
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Pattern matching
regex = "1"
ipnetwork = "0.20"

# TLS
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
rustls = { version = "0.23", features = ["ring"] }

# Unix system
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Embedded web frontend

[profile.release]
opt-level = 3
lto = true
strip = true

# ── Workspace ────────────────────────────────────────────────────────────────
# 锚点层（EmailBinding / DomainControl 的 preimage、生命周期、VC 组装端口）独立成 crate：
# 它既不能放进 did-sdk（规范级约束 R1：不做链查询），也不能放进 chain-sdk（声明不含
# VC/治理语义），埋在 gateway 里又不可复用、难单测。见 docs/DID-SIGNATURE-PROTOCOL.md。
[workspace]
members = [".", "crates/mail-anchor"]
exclude = ["vendor"]
resolver = "2"
