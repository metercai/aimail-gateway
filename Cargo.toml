[package]
name = "amail-gateway"
version = "1.0.0"
edition = "2021"
description = "Lightweight SMTP ↔ HTTP bidirectional email gateway for hybrid human–agent group conversations."
license = "MPL-2.0"
repository = "https://github.com/metercai/amail-gateway"
authors = ["metercai"]

[[bin]]
name = "amail-gateway"
path = "src/main.rs"

[lib]
name = "amail_base"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }

# HTTP framework
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"

# HTTP client (webhook delivery) — pure Rust TLS, no OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
async-trait = "0.1"

# Database (SQLite with bundled libsqlite3)
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# SMTP server
mailin = { path = "vendor/mailin" }

# SMTP client — pure Rust TLS (rustls), no OpenSSL
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }

# MIME parsing
mailparse = "0.15"

# Encoding conversion for MIME body charset (GBK, GB2312, etc.)
encoding_rs = "0.8"

# HTML → Markdown conversion
html-to-markdown-rs = "3"

# Encoding / crypto
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"

# Identifiers
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Pattern matching
regex = "1"
ipnetwork = "0.20"

# TLS
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
rustls = { version = "0.23", features = ["ring"] }

# Unix system
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Embedded web frontend

[profile.release]
opt-level = 3
lto = true
strip = true

